appId: com.fuelgood.ios
---
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- tapOn: "Create Plan"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-builder-top"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-builder-mid"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-builder-bottom"
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-step2-top"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-step2-bottom"
