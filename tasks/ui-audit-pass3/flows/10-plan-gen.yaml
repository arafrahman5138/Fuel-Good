    duration: 400
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-builder-bottom"
- tapOn: "Continue"
- waitForAnimationToEnd:
    timeout: 3500
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-step2"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit-pass3/screenshots/dark/07-plan-step2-scroll"
