appId: com.fuelgood.ios
---
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 2000
- openLink: fuelgood://scan
- extendedWaitUntil:
    visible: "Choose photo from library"
    timeout: 15000
- tapOn: "Choose photo from library"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "tasks/scan-audit/screenshots/ux-10-photo-picker"
- tapOn:
    point: "18%,22%"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "tasks/scan-audit/screenshots/ux-11-after-picker-tap"
- extendedWaitUntil:
    visible: "Log to Chronometer"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "tasks/scan-audit/screenshots/ux-12-meal-result"
- scroll
- takeScreenshot: "tasks/scan-audit/screenshots/ux-13-meal-result-s1"
- scroll
- takeScreenshot: "tasks/scan-audit/screenshots/ux-14-meal-result-s2"
- scroll
- takeScreenshot: "tasks/scan-audit/screenshots/ux-15-meal-result-s3"
