appId: com.fuelgood.ios
---
- tapOn: ".*Home"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Open profile"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "tasks/ui-audit/screenshots/dark/50-profile-01-overview"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit/screenshots/dark/50-profile-02-scrolled"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit/screenshots/dark/50-profile-03-scrolled2"
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
# Open settings via gear icon
- tapOn: ".*settings.*"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "tasks/ui-audit/screenshots/dark/50-profile-04-settings"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit/screenshots/dark/50-profile-05-settings-scroll"
