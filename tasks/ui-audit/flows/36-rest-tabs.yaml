appId: com.fuelgood.ios
---
# Track
- tapOn: ".*Track"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "tasks/ui-audit/screenshots/dark/30-track-01-dashboard"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit/screenshots/dark/30-track-02-scroll"
- swipe:
    start: "50%,80%"
    end: "50%,20%"
    duration: 400
- takeScreenshot: "tasks/ui-audit/screenshots/dark/30-track-03-scroll2"
- swipe:
    direction: DOWN
    duration: 400
- swipe:
    direction: DOWN
    duration: 400
# Coach
- tapOn: ".*Coach"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "tasks/ui-audit/screenshots/dark/40-coach-01-chat"
