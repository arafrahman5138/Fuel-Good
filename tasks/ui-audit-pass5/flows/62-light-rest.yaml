appId: com.fuelgood.ios
---
# Recipe detail
- tapOn:
    text: "Open recipe Bang Bang Chicken Skewers.*"
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L10-recipe-detail"
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L10b-recipe-scroll"
- swipe:
    start: "50%,30%"
    end: "50%,80%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 1000

# Cook mode (small ghost button bottom left)
- tapOn:
    point: "15%,88%"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L11-cook-step1"

# X to close cook
- tapOn:
    point: "92%,9%"
- waitForAnimationToEnd:
    timeout: 1500

# Track tab
- tapOn:
    point: "50%,96%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L50-track-fuel"
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L50b-track-fuel-scroll"

# Metabolic toggle
- tapOn:
    point: "75%,17%"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L51-track-metabolic"

# Coach
- tapOn:
    point: "70%,96%"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L52-coach-init"

# Profile
- tapOn:
    point: "10%,96%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Open profile"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L20-profile"

# Settings
- tapOn:
    text: "Open settings"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L22-settings"
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L22b-settings-scroll"
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/light/L22c-settings-scroll-2"
