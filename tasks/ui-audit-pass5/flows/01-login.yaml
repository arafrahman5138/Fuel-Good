appId: com.fuelgood.ios
---
- tapOn: "you@example.com"
- inputText: "pass5.tester+qa@qatest.fuelgood.app"
- tapOn: "Email"
- waitForAnimationToEnd:
    timeout: 500
- tapOn: "Enter password"
- inputText: "TestPass123!"
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/01b-login-filled"
- tapOn: "Sign In"
- waitForAnimationToEnd:
    timeout: 12000
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/02-post-login"
