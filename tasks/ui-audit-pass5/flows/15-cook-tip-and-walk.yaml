appId: com.fuelgood.ios
---
# Wait for tip to render fully
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/11b-cook-step1-tips-rendered"
- swipe:
    start: "50%,30%"
    end: "50%,80%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/11c-cook-step1-tips-scrolled"
# Scroll back to top
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 400
- waitForAnimationToEnd:
    timeout: 600

# Step 2
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/12-cook-step2"

# Step 3 (final)
- tapOn: "Next"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/13-cook-step3"

# Try Log & Finish (or Finish, or whatever the final CTA is)
- runFlow:
    when:
      visible: ".*Log & Finish.*|.*Finish.*"
    commands:
      - takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/14-cook-final-cta"
      - tapOn: ".*Log & Finish.*|.*Finish.*"
      - waitForAnimationToEnd:
          timeout: 6000
      - takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/15-post-cook-celebration"

# Fallback: maybe Next is the finish trigger
- runFlow:
    when:
      visible: "Next"
    commands:
      - tapOn: "Next"
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: "tasks/ui-audit-pass5/screenshots/dark/15-post-cook-celebration-alt"
