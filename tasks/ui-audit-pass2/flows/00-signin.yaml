appId: com.fuelgood.ios
---
# Log back into existing premium account
- tapOn:
    point: "82%,92%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Sign In"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "you@example.com"
- inputText: "newtester0418x@example.com"
- tapOn: "Enter password"
- inputText: "TestPass12345!"
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 500
- tapOn:
    text: "Sign In"
    index: 1
- waitForAnimationToEnd:
    timeout: 10000
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: "tasks/ui-audit-pass2/screenshots/light/00-home-after-signin"
