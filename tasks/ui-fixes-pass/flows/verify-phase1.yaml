appId: com.fuelgood.ios
---
- tapOn: "you@example.com"
- inputText: "newtester0418x@example.com"
- tapOn: "Enter password"
- inputText: "TestPass12345!"
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 500
- tapOn: "Sign In"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: "tasks/ui-fixes-pass/phase1-home-empty"
# Navigate to Meals hub → Grocery
- tapOn:
    point: "32%,94%"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn: "Open Grocery, Shopping list"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "tasks/ui-fixes-pass/phase1-grocery"
- tapOn:
    point: "10%,10%"
- waitForAnimationToEnd:
    timeout: 1500
