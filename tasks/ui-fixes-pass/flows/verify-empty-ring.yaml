appId: com.fuelgood.ios
---
# Go to profile → settings → sign out
- tapOn: "Open profile"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn: "Open settings"
- waitForAnimationToEnd:
    timeout: 2000
- scrollUntilVisible:
    element: ".*Sign Out"
    direction: DOWN
- tapOn: ".*Sign Out"
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible: "Sign Out"
    commands:
      - tapOn:
          text: "Sign Out"
          index: 1
      - waitForAnimationToEnd:
          timeout: 3000
# Register fresh
- tapOn:
    point: "82%,92%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "Your name"
- inputText: "Empty Ring"
- tapOn: "you@example.com"
- inputText: "empty-ring-0420@example.com"
- tapOn: "Enter password"
- inputText: "EmptyRing12345!"
- tapOn: "Password"
- waitForAnimationToEnd:
    timeout: 500
- tapOn: "Create Account"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
      - waitForAnimationToEnd:
          timeout: 1500
- takeScreenshot: "tasks/ui-fixes-pass/empty-onb-start"
